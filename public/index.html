<!doctype html>
<html lang="en">

<style>
:root{--bg:#F2F3FA;--card:#fff;--ink:#15162E;--mute:#6B6F92;--line:#E5E7F3;--safe:#0A8A5E;--warn:#AD6800;--loss:#D92D3F;--acc:#4F46E5;--on:#fff;--shadow:0 1px 2px rgba(20,22,60,.05),0 10px 28px rgba(20,22,60,.07);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0C0D1D;--card:#16172E;--ink:#EEF0FF;--mute:#9A9EC4;--line:#262850;--safe:#3DD598;--warn:#F5B544;--loss:#FF6B78;--acc:#8B83FF;--on:#0C0D1D;--shadow:0 0 0 rgba(0,0,0,0)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
h1{font-size:26px;font-weight:750;letter-spacing:-.02em;margin:0}
h2{font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:26px 4px 10px}
h3{margin:0 0 10px;font-size:18px}
.sp{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:46px;padding:0 18px;background:var(--acc);color:var(--on);cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

button.wide{width:100%;margin-top:8px}
button.icon{min-height:40px;width:40px;padding:0;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.hero{background:linear-gradient(135deg,#5B4BDB,#3B2FB5);color:#fff;border:0;box-shadow:0 14px 30px rgba(79,70,229,.30)}
.hero small{color:rgba(255,255,255,.78);font-size:13px}
.hero .big{font-size:34px;letter-spacing:-.02em}

.hero-sub{display:flex;gap:10px;margin-top:14px}

.hero .badge.safe::before{background:#5CE6AB}.hero .badge.close::before{background:#FFC857}.hero .badge.losing::before{background:#FF8A94}
.safe{color:var(--safe)}.close{color:var(--warn)}.losing{color:var(--loss)}
.hero .safe{color:#7CF0B8}.hero .close{color:#FFD88A}.hero .losing{color:#FFA1AA}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}

.chart{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
.chart text{fill:var(--mute);font-size:10px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ms,.chart .ew{stroke-width:1.5;stroke-dasharray:5 4}.chart .ms{stroke:var(--loss)}.chart .ew{stroke:var(--warn)}
.chart polyline{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}.chart .la{stroke:var(--mute)}.chart .ly{stroke:var(--acc)}
.chart .cur{stroke:var(--ink);stroke-width:1;opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 4px 0;font-size:12.5px;color:var(--mute)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}

.rp-main{flex:1;min-width:0}.rp-top{display:flex;align-items:center;gap:8px}

button.link{min-height:0;padding:0;background:none;color:var(--acc);font-weight:600;font-size:14px;text-decoration:underline dotted;text-underline-offset:3px}
.st-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
button.st{min-height:34px;padding:0 14px;font-size:14px;border-radius:11px}
button.st.paid{background:color-mix(in srgb,var(--safe) 14%,transparent);color:var(--safe)}
.pend{color:var(--mute);font-size:12px}
td button{min-height:28px;padding:0 8px;background:transparent;color:var(--ink);border:1px dashed var(--line);border-radius:8px;font-size:14px;font-weight:500}
dialog{margin:auto auto 0;width:min(100%,520px);max-height:90vh;overflow:auto;border:0;border-radius:26px 26px 0 0;background:var(--card);color:var(--ink);padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
dialog::backdrop{background:rgba(10,10,30,.5)}
label{display:block;margin:10px 0;font-size:13.5px;color:var(--mute)}
input{display:block;width:100%;font:inherit;font-size:16px;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin-top:5px}
input:focus{border-color:var(--acc)}
small{color:var(--mute)}.col{display:flex;flex-direction:column;gap:10px}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.lock::before{content:"\20a6";width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#5B4BDB,#3B2FB5);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700;margin:0 auto 2px;box-shadow:0 12px 26px rgba(79,70,229,.3)}
.lock input{height:64px;font-size:28px;letter-spacing:.5em;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;max-width:180px;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;min-height:52px;padding:4px 0;border-radius:14px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;max-width:90vw;display:none;z-index:20}
@media(prefers-reduced-motion:no-preference){button{transition:opacity .15s,transform .15s}button:active{opacity:.75;transform:scale(.98)}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u => { let s = ''; for (const x of new Uint8Array(u)) s += String.fromCharCode(x); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unb64url = s => unb64(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '='));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const N = (n, d = 2) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
// Add m calendar months, keeping the day but capping it at the month's last day (Jan 31 + 1 = Feb 28).
const addM = (d, m) => {
  const [y, mo, day] = d.split('-').map(Number), t = mo - 1 + m, ty = y + Math.floor(t / 12), tm = ((t % 12) + 12) % 12;
  const last = new Date(Date.UTC(ty, tm + 1, 0)).getUTCDate();
  return `${ty}-${String(tm + 1).padStart(2, '0')}-${String(Math.min(day, last)).padStart(2, '0')}`;
};
// The old addM rolled over (Jan 31 + 1 month = Mar 3). Used only to find and repair dates it produced.
const oldAddM = (d, m) => { const x = new Date(d + 'T12:00:00'); x.setMonth(x.getMonth() + m); return x.toISOString().slice(0, 10); };
function fixSchedDates() {
  let n = 0;
  for (const v of state.vaults) for (const r of (v.repay === 'monthly' && v.sched) || []) {
    const bad = oldAddM(v.start, r.n), good = addM(v.start, r.n);
    if (r.date === bad && bad !== good) { r.date = good; n++; }
    // Older rows had only an optional "rate you paid". A row with that rate becomes Paid; the rest start as Pending.
    if (!r.status) { if (r.rate > 0) Object.assign(r, { status: 'paid', paidRate: r.rate, fee: 0, paidOn: r.date }); else r.status = 'pending'; delete r.rate; n++; }
  }
  return n;
}
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 7000); };

/* ---------- encryption ---------- */
const KEY = 'nv_store', FK = 'nv_fails';
let store = JSON.parse(localStorage.getItem(KEY) || 'null'), state = null, DK = null, DKraw = null, view = { n: 'list' }, offline = false;
const saveStore = () => localStorage.setItem(KEY, JSON.stringify(store));
const importDK = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function kek(secret, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) }; }
async function open(key, o) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct))); }
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
async function save() { if (!state || !DK) return; store.data = await seal(DK, enc.encode(JSON.stringify(state))); saveStore(); }
async function persist() {
  await save();
  if (store.sync && store.sync.on) { store.sync.dirty = true; saveStore(); pushSoon(); }
  sync();
}

async function guarded(fn) {
  const f = JSON.parse(localStorage.getItem(FK) || '{"n":0,"until":0}');
  if (Date.now() < f.until) return { err: `Too many tries. Wait ${Math.ceil((f.until - Date.now()) / 1000)} seconds.` };
  try { const r = await fn(); localStorage.removeItem(FK); return { r }; }
  catch { f.n++; if (f.n >= 5) f.until = Date.now() + 30000 * 2 ** Math.min(f.n - 5, 8); localStorage.setItem(FK, JSON.stringify(f)); return { err: 'That did not match.' }; }
}

/* ---------- lock, setup, recovery, biometrics ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('nv', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbSet = async (k, v) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('k', 'readwrite'); t.objectStore('k').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbGet = async k => { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('k').objectStore('k').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };

let lt, hiddenAt = 0;
const reset = () => { clearTimeout(lt); if (state) lt = setTimeout(lock, state.settings.lockMin * 60000); };
['click', 'keydown', 'touchstart', 'scroll'].forEach(e => addEventListener(e, reset, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (state && Date.now() - hiddenAt > state.settings.lockMin * 60000) lock();
  else if (state) { refresh(); syncNow(); }
});
function lock() {
  // Cancel any open dialog so the code waiting on it finishes now (as Cancel) instead of after the data is gone.
  document.querySelectorAll('dialog[open]').forEach(d => d.close(''));
  state = DK = DKraw = null; clearTimeout(lt); lockView();
}

function lockView(mode) {
  const a = $('#app');
  const pinBox = '<input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off" aria-label="4-digit PIN">';
  if (!store) {
    // Each lock screen is a form, so Enter (or Go on a phone keyboard) runs the main button.
    a.innerHTML = `<form class="lock" onsubmit="event.preventDefault();doSetup()"><h1>Naira Vaults</h1><p class="mute">Set a 4-digit PIN. Your data is encrypted on this device with it.</p>${pinBox}<input id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Repeat PIN" placeholder="repeat"><button>Create PIN</button><button type="button" class="ghost" onclick="joinView()">Sync from another device</button><p id="err" class="losing"></p></form>`;
  } else if (mode === 'recover') {
    a.innerHTML = `<form class="lock" style="font-size:16px" onsubmit="event.preventDefault();doRecover()"><h1>Recover access</h1><p class="mute">${esc(store.q || '')}</p><label>Your answer<input id="ans" type="text" style="font-size:16px;letter-spacing:0;text-align:left"></label><label>New 4-digit PIN${pinBox}</label><button>Reset PIN</button><button type="button" class="ghost" onclick="lockView()">Back</button><p id="err" class="losing"></p></form>`;
  } else {
    a.innerHTML = `<form class="lock" onsubmit="event.preventDefault();doUnlock()"><h1>Naira Vaults</h1>${pinBox}<button>Unlock</button>${store.bio ? '<button type="button" class="ghost" onclick="doBio()">Use fingerprint or face</button>' : ''}${store.wrapAns ? '<button type="button" class="ghost" onclick="lockView(\'recover\')">Forgot PIN</button>' : ''}<p id="err" class="losing"></p></form>`;
    if (store.bio) setTimeout(doBio, 200);
  }
}
const showErr = m => ($('#err').textContent = m);
async function doSetup() {
  const p = $('#pin').value;
  if (!/^\d{4}$/.test(p)) return showErr('Use exactly 4 digits.');
  if (p !== $('#pin2').value) return showErr('The two PINs do not match.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  DKraw = crypto.getRandomValues(new Uint8Array(32)); DK = await importDK(DKraw);
  store = { salt: b64(salt), wrapPin: await seal(await kek(p, salt), DKraw) };
  state = { vaults: [], rates: {}, latest: null, deviceId: crypto.randomUUID(), settings: { margin: 10, tax: 10, lockMin: 5, appKey: '' } };
  await persist(); started();
}
async function doUnlock() {
  const p = $('#pin').value; showErr('');
  const { r, err } = await guarded(async () => open(await kek(p, unb64(store.salt)), store.wrapPin));
  if (err) return showErr(err.replace('That did not match.', 'Wrong PIN.'));
  await finish(r);
}
async function doRecover() {
  const p = $('#pin').value; showErr('');
  if (!/^\d{4}$/.test(p)) return showErr('Use exactly 4 digits for the new PIN.');
  const a = $('#ans').value;
  const { r, err } = await guarded(async () => open(await kek(norm(a), unb64(store.ansSalt)), store.wrapAns));
  if (err) return showErr(err.replace('That did not match.', 'That answer does not match.'));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  store.salt = b64(salt); store.wrapPin = await seal(await kek(p, salt), r); saveStore();
  await finish(r);
}
async function doBio() {
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(store.bio.id) }], userVerification: 'required', timeout: 60000 } });
    await finish(await open(await idbGet('dk'), store.bio));
  } catch { /* cancelled: PIN still works */ }
}
async function finish(raw) {
  DKraw = raw; DK = await importDK(raw);
  state = JSON.parse(dec.decode(await open(DK, store.data)));
  if (fixSchedDates()) { await save(); sync(); }
  started();
}
function started() { view = { n: 'list' }; reset(); render(); refresh(); syncNow(); }
async function enableBio() {
  try {
    const cred = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Naira Vaults' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: 'Owner' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    const dk = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    await idbSet('dk', dk);
    store.bio = { id: b64(cred.rawId), ...(await seal(dk, DKraw)) }; saveStore();
    toast('Biometric unlock is on.'); render();
  } catch { toast('Could not turn on biometrics on this device.'); }
}
async function changePin() {
  const o = await ask('Change PIN', [{ k: 'p', label: 'New 4-digit PIN', type: 'password' }]);
  if (!o) return;
  if (!/^\d{4}$/.test(o.p)) return toast('Use exactly 4 digits.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  store.salt = b64(salt); store.wrapPin = await seal(await kek(o.p, salt), DKraw); saveStore(); toast('PIN changed.');
}
async function setRecovery() {
  const o = await ask('Recovery question', [{ k: 'q', label: 'Question only you can answer', type: 'text', value: store.q }, { k: 'a', label: 'Answer (use a long phrase)', type: 'text' }], 'Save');
  if (!o || !o.q || !o.a) return;
  if (norm(o.a).length < 8) return toast('Make the answer longer: at least 8 characters.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  store.q = o.q; store.ansSalt = b64(salt); store.wrapAns = await seal(await kek(norm(o.a), salt), DKraw); saveStore();
  toast('Recovery question saved.'); render();
}

/* ---------- dialogs ---------- */
function ask(title, fields, okText = 'Save') {
  return new Promise(res => {
    const d = document.createElement('dialog');
    // The OK button comes first in the markup so Enter submits it; row-reverse still shows Cancel on the left.
    d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${fields.map(f => `<label>${esc(f.label)}<input name="${f.k}" type="${f.type === 'secret' ? 'password' : f.type || 'number'}" step="any" autocomplete="off" value="${esc(f.value ?? '')}" ${f.type === 'password' ? 'inputmode="numeric" maxlength="4"' : ''}></label>`).join('')}<div class="row" style="flex-direction:row-reverse"><button value="ok">${okText}</button><button value="x" class="ghost">Cancel</button></div></form>`;
    d.onclose = () => { const ok = d.returnValue === 'ok', o = {}; if (ok) fields.forEach(f => { const v = d.querySelector(`[name=${f.k}]`).value; o[f.k] = (f.type || 'number') === 'number' ? Number(v) : v; }); d.remove(); res(ok ? o : null); };
    document.body.appendChild(d); d.showModal();
  });
}
function pick(title, msg, opts) {
  return new Promise(res => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="col">${opts.map((o, i) => `<button value="${i}" class="${i ? 'ghost' : ''}">${esc(o)}</button>`).join('')}</div></form>`;
    d.onclose = () => { const r = d.returnValue; d.remove(); res(r === '' ? -1 : Number(r)); };
    document.body.appendChild(d); d.showModal();
  });
}
const HELP = {

  catch { throw new Error('The online copy was made with different keys. Turn sync off and on again.'); }

  let tot = 0; const n = { safe: 0, close: 0, losing: 0 };
  const cards = state.vaults.map(v => {
    const c = calc(v), r = rows(v).at(-1); tot += v.loan; if (r) n[statusOf(v, r.your)]++;
    return `<div class="card tap" onclick="nav('vault','${v.id}')"><div class="row"><b>${esc(v.name)}</b>${r ? badge(statusOf(v, r.your)) : '<span class="mute">No rates yet</span>'}</div>
    <div class="grid" style="margin-top:10px"><div><small>Today's rate</small><b>${r ? '\u20a6' + N(r.your) : '\u2013'}</b></div><div><small>Max safe rate</small><b>\u20a6${N(c.maxSafe)}</b></div><div><small>Room left</small><b class="${r ? sgn(c.maxSafe - r.your) : ''}">${r ? '\u20a6' + N(c.maxSafe - r.your) : '\u2013'}</b></div><div><small>Loan</small><b>$${N(v.loan, 0)}</b></div></div></div>`;
  }).join('');
  const hero = state.vaults.length
    ? `<div class="card hero"><small>Total loans</small><div class="big">$${N(tot, 0)}</div><div class="chips"><span class="badge safe">${n.safe} Safe</span><span class="badge close">${n.close} Getting close</span><span class="badge losing">${n.losing} Losing</span></div></div>`
    : '<div class="card hero"><div class="big">Welcome</div><p>A vault is one loan with its interest, and the investments you put it into. Create your first one below.</p></div>';
  return hdr('Vaults') + hero + cards + '<button class="wide" onclick="newVault()">New vault</button>';
}
// Rate history chart: axes with ₦ labels, dates along the bottom, and a tap/drag readout.
let CH = null;
const fmtDY = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' });
const fmtD = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
function chart(rs, c, v) {
  const W = 340, H = 190, L = 46, R = 10, T = 10, B = 24, early = c.maxSafe - v.margin;
  const ys = rs.flatMap(r => [r.api, r.your]).concat([c.maxSafe, early]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max((hi - lo) * 0.08, 2); lo -= pad; hi += pad;
  const n = rs.length, x = i => (n < 2 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (n - 1)), y = val => T + ((hi - val) / (hi - lo)) * (H - T - B);
  const ticks = [0, 1, 2, 3].map(k => lo + ((hi - lo) * k) / 3);
  const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${N(t, 0)}</text>`).join('');
  const xi = n < 2 ? [0] : [...new Set([0, Math.round((n - 1) / 2), n - 1])];
  const xl = xi.map(i => `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${n < 2 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${fmtD(rs[i].d)}</text>`).join('');
  const hl = (val, cls) => `<line class="${cls}" x1="${L}" x2="${W - R}" y1="${y(val).toFixed(1)}" y2="${y(val).toFixed(1)}"/>`;
  const pl = k => rs.map((r, i) => `${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join(' ');
  const dots = n <= 40 ? rs.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.your).toFixed(1)}" r="2.2" fill="var(--acc)"/>`).join('') : '';
  CH = { rs, c, W, n, L, R, x, y };
  return `<div class="card chart-card"><p class="chart-date" id="chD"></p><div class="chart-read"><div><small>Market</small><b id="chA"></b></div><div><small>Yours</small><b id="chY"></b></div><div><small>Room left</small><b id="chR"></b></div></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rate history. Tap or drag to see each day." onpointerdown="chartPick(event)" onpointermove="chartPick(event)">${grid}${hl(c.maxSafe, 'ms')}${hl(early, 'ew')}<polyline class="la" points="${pl('api')}"/><polyline class="ly" points="${pl('your')}"/>${dots}
  <line id="chL" class="cur" y1="${T}" y2="${H - B}"/><circle id="chCa" r="4" fill="var(--mute)" stroke="var(--card)" stroke-width="2"/><circle id="chCy" r="5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>${xl}</svg>
  <div class="legend"><span><i style="border-color:var(--mute)"></i>Market rate</span><span><i style="border-color:var(--acc)"></i>Your rate</span><span><i class="d" style="border-color:var(--loss)"></i>Max safe ₦${N(c.maxSafe)}</span><span><i class="d" style="border-color:var(--warn)"></i>Early warning ₦${N(early)}</span></div>
  <p class="mute" style="margin:8px 4px 0;font-size:12.5px">Tap or drag across the chart to see any day.</p></div>`;
}
function chartShow(i) {
  if (!CH || !$('#chD')) return;
  const r = CH.rs[i], room = CH.c.maxSafe - r.your, px = CH.x(i).toFixed(1);
  $('#chD').textContent = fmtD(r.d) + (i === CH.n - 1 ? ' (latest)' : '');
  $('#chA').textContent = '₦' + N(r.api); $('#chY').textContent = '₦' + N(r.your) + (r.edited ? ' ✎' : '');
  const R = $('#chR'); R.textContent = '₦' + N(room); R.className = sgn(room);
  $('#chL').setAttribute('x1', px); $('#chL').setAttribute('x2', px);
  $('#chCa').setAttribute('cx', px); $('#chCa').setAttribute('cy', CH.y(r.api).toFixed(1));
  $('#chCy').setAttribute('cx', px); $('#chCy').setAttribute('cy', CH.y(r.your).toFixed(1));
}
function chartPick(e) {
  if (!CH) return;
  const b = e.currentTarget.getBoundingClientRect(), px = ((e.clientX - b.left) / b.width) * CH.W;
  const i = CH.n < 2 ? 0 : Math.round(((px - CH.L) / (CH.W - CH.L - CH.R)) * (CH.n - 1));
  chartShow(Math.max(0, Math.min(CH.n - 1, i)));
}
function vaultHTML(v) {
  const c = calc(v), rs = rows(v), r = rs.at(-1), gap = gapFor(v, today());
  const cur = r ? r.your : null, pr = cur ? profitOf(c, cur) : null, mo = v.repay === 'monthly';
  const pTxt = pr ? (pr.naira >= 0 ? '+' : '\u2212') + '$' + N(Math.abs(pr.usd)) + ' (\u20a6' + N(Math.abs(pr.naira), 0) + ')' : '\u2013';
  const stats = `<div class="card hero"><div class="row"><div><small>Today's rate (yours)</small><div class="big">${r ? '₦' + N(r.your) : '–'}</div></div>${r ? badge(statusOf(v, r.your)) : ''}</div><div class="hero-sub"><span>Max safe rate<b>\u20a6${N(c.maxSafe)}</b></span><span>Room left<b class="${r ? sgn(c.maxSafe - r.your) : ''}">${r ? '\u20a6' + N(c.maxSafe - r.your) : '\u2013'}</b></span></div></div>
  <div class="card"><div class="grid">
  <div><small>Max safe rate${q('maxSafe')}</small><b>₦${N(c.maxSafe)}</b></div>
  <div><small>Early warning rate${q('early')}</small><b>₦${N(c.maxSafe - v.margin)}</b></div>
  <div><small>Room left${q('room')}</small><b class="${r ? sgn(c.maxSafe - r.your) : ''}">${r ? '₦' + N(c.maxSafe - r.your) : '–'}</b></div>
  <div><small>Rate gap${q('gap')}</small><b>₦${N(gap)}</b></div>
  <div><small>Converted${v.fee > 0 ? ' (after ' + N(v.fee, 2) + '% fee)' : ''}</small><b>₦${N(c.conv, 0)}</b></div>
  ${mo ? `<div><small>Monthly payment</small><b>$${N(v.sched[0] ? v.sched[0].usd : 0)}</b></div>` : `<div><small>Repay by ${addM(v.start, v.term)}</small><b>$${N(c.repay)}</b></div>`}
  <div><small>Naira at the end</small><b>₦${N(c.end, 0)}</b></div>
  <div><small>${!mo ? "If repaid at today's rate" : c.done ? 'Total profit' : 'Total profit (projected)'}</small><b class="${pr ? (pr.naira >= 0 ? 'safe' : 'losing') : ''}">${pTxt}</b></div>${mo ? `<div><small>Paid so far</small><b>$${N(c.paidUsd)} of $${N(c.repay)}</b></div><div><small>Average rate paid (incl. fees)</small><b>${c.paidUsd ? '\u20a6' + N(c.paidCost / c.paidUsd) : '\u2013'}</b></div>` : ''}</div></div></div>`;
  const inv = v.investments.map(i => `<div class="card"><div class="row"><b>${esc(i.name)}</b><span><button class="ghost sm" onclick="editInv('${v.id}','${i.id}')">Edit</button> <button class="ghost sm" onclick="delInv('${v.id}','${i.id}')">Remove</button></span></div><p class="mute" style="margin:6px 0 0">₦${N(i.amount, 0)} at ${N(i.gross, 1)}% with ${N(i.tax, 1)}% tax on the gain, ${i.tenor} months. Pays ₦${N(i.amount * (1 + (i.gross / 100) * (1 - i.tax / 100) * (i.tenor / 12)), 0)}.</p></div>`).join('');
  const left = c.conv - c.put;
  const sch = mo ? `<h2>Repayments</h2><div class="card replist">${v.sched.map(x => {
    const paid = x.status === 'paid', rt = rowRate(v, x, cur), est = !paid && x.date > today(), nn = rowNaira(x, rt), t = est ? ' ~' : '';
    const usd = '$' + N(x.usd) + (paid && x.fee ? ' + $' + N(x.fee) + ' fee' : '');
    return `<div class="rp"><div class="rp-main"><div class="rp-top"><b>#${x.n}</b><button class="link" onclick="editDue('${v.id}',${x.n})" aria-label="Change due date of repayment ${x.n}">${fmtDY(x.date)}</button></div>
    <div class="rp-sub">${usd} × ${rt ? '₦' + N(rt) + t : '–'}</div><div class="rp-naira">${nn ? '₦' + N(nn, 0) + t : '–'}</div></div>
    ${paid ? `<button class="st paid" onclick="payInstall('${v.id}',${x.n})">Paid ✓</button>` : `<div class="st-wrap"><span class="pend">Pending</span><button class="st pay" onclick="payInstall('${v.id}',${x.n})">Pay</button></div>`}</div>`; }).join('')}</div><p class="mute">Paid rows use the rate and fee you entered. A pending row whose due date has passed uses your rate on that day. ~ is an estimate at today’s rate. Tap a date to change it.</p>` : '';
  const table = rs.length ? `<div class="scroll"><table><tr><th>Date</th><th>Market</th><th>Yours</th><th>Room left</th><th>Status</th></tr>${[...rs].reverse().map(x => `<tr><td>${x.d}</td><td>${N(x.api)}</td><td><button onclick="editRate('${v.id}','${x.d}')">${N(x.your)}${x.edited ? ' ✎' : ''}</button></td><td class="${sgn(c.maxSafe - x.your)}">${N(c.maxSafe - x.your)}</td><td class="${statusOf(v, x.your)}">${BADGE[statusOf(v, x.your)]}</td></tr>`).join('')}</table></div>` : '<p class="note">No rates yet. In Settings, enter the server key to load live rates.</p>';
  return hdr(v.name, true) + stats + (rs.length ? '<h2>Rate history</h2>' + chart(rs, c, v) : '') +
    `<h2>Investments</h2>${inv || '<p class="note">Add the investments this loan is put into.</p>'}${Math.abs(left) > 1 ? `<p class="mute">${left > 0 ? '₦' + N(left, 0) + ' of the converted loan is not invested yet and counts as earning nothing.' : 'Your investments add up to ₦' + N(-left, 0) + ' more than the converted loan.'}</p>` : ''}<button onclick="addInv('${v.id}')">Add investment</button>` +
    `${sch}<h2>Daily history</h2>${table}<h2>Vault</h2><div class="row"><button class="ghost" onclick="editVault('${v.id}')">Edit vault</button><button class="ghost" onclick="delVault('${v.id}')">Delete vault</button></div>`;
}
function settingsHTML() {
  const s = state.settings;
  return hdr('Settings') + `<div class="card"><div class="grid"><div><small>Safety margin (new vaults)${q('margin')}</small><b>₦${N(s.margin)}</b></div><div><small>Default tax on gains</small><b>${N(s.tax, 1)}%</b></div><div><small>Auto-lock</small><b>${s.lockMin} min</b></div><div><small>Server key</small><b>${s.appKey ? 'Set' : 'Not set'}</b></div></div><p><button onclick="editSettings()">Edit settings</button></p></div>
  <h2>Security</h2><div class="col"><button class="ghost" onclick="changePin()">Change PIN</button><button class="ghost" onclick="enableBio()">${store.bio ? 'Reset biometric unlock' : 'Turn on biometric unlock'}</button><button class="ghost" onclick="setRecovery()">${store.wrapAns ? 'Change recovery question' : 'Set recovery question'}</button></div>
  ${store.wrapAns ? '' : '<p class="note" style="margin-top:8px">No recovery question yet. If you forget your PIN, your data cannot be recovered.</p>'}
  <h2>Alerts</h2><div class="col"><button class="ghost" onclick="enablePush()">Turn on push alerts</button><button class="ghost" onclick="testPush()">Send a test alert</button></div>
  <h2>Sync</h2>${store.sync && store.sync.on ? `<div class="card"><b>Sync is on</b><p class="mute" style="margin:4px 0 0">${store.sync.last ? 'Last synced ' + new Date(store.sync.last).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + '.' : ''}${store.sync.dirty ? ' Changes waiting to upload.' : ''}</p></div><div class="col"><button class="ghost" onclick="syncNow(true)">Sync now</button><button class="ghost" onclick="disableSync()">Turn off sync</button></div>` : '<p class="mute">Keep the same vaults on your phone and laptop. Your data is encrypted with a sync passphrase before it leaves this device.</p><div class="col"><button class="ghost" onclick="enableSync()">Turn on sync</button></div>'}
  <h2>Backup</h2><div class="col"><button class="ghost" onclick="exportBackup()">Download encrypted backup</button><label class="ghost" style="border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);margin:0">Restore a backup<input type="file" accept=".json" onchange="importBackup(this)" style="display:none"></label></div>
  <p class="mute">Backups stay encrypted. You need your PIN or recovery answer to open one.</p>`;
}
function ratesHTML() {
  const typed = state.parallel || {}, auto = state.parallelApi || {}, pi = state.parallelInfo || {};
  const all = [...new Set([...Object.keys(state.rates), ...Object.keys(typed), ...Object.keys(auto), today()])].sort(), days = all.slice(-7).reverse();
  const mkt = Object.keys(state.rates).sort(); // change compares with the previous day that has a market rate
  const when = iso => new Date(iso).toLocaleString('en-GB', { timeZone: 'Africa/Lagos', dateStyle: 'medium', timeStyle: 'short' });
  const body = days.map(d => {
    const r = state.rates[d], prev = r != null ? state.rates[mkt[mkt.indexOf(d) - 1]] : null, ch = r != null && prev != null ? r - prev : null;
    const mine = typed[d], b = mine || auto[d];
    const chCell = ch == null ? '\u2013' : (ch > 0 ? '\u25b2 +' : ch < 0 ? '\u25bc ' : '') + N(ch);
    return `<tr><td>${d}</td><td>${r != null ? N(r) : '\u2013'}</td><td class="${sgn(ch)}">${chCell}</td><td><button onclick="setParallel('${d}')">${b ? N(b) + (mine ? ' \u270e' : '') : '+ add'}</button></td></tr>`;
  }).join('');
  const upd = (state.latest ? `<p class="mute">Market rate last updated ${when(state.latest.at)}.</p>` : '') + (pi.latest ? `<p class="mute">Black market (Monierate) last updated ${when(pi.latest.at)}.</p>` : '');
  const bad = pi.lastError && (!pi.latest || pi.lastError.at > pi.latest.at) ? '<p class="note">The latest black market check failed, so the last good value is shown.</p>' : '';
  return hdr('Rates') + (Object.keys(state.rates).length ? '' : '<p class="note">No market rates yet. Enter the server key in Settings to load them.</p>') +
    `<p class="mute">Market rate in \u20a6 per $1, last 7 days. Change is green with \u25b2 when the rate went up and red with \u25bc when it went down. The black market rate comes from Monierate twice a day. Tap a cell to enter your own rate instead; \u270e marks one you entered.</p><div class="card scroll"><table><tr><th>Date</th><th>Market</th><th>Change</th><th>Black market</th></tr>${body}</table></div>${upd}${bad}`;
}
function render() {
  let html;
  if (view.n === 'rates') html = ratesHTML();
  else if (view.n === 'settings') html = settingsHTML();
  else if (view.n === 'vault' && state.vaults.some(v => v.id === view.id)) html = vaultHTML(state.vaults.find(v => v.id === view.id));
  else { view = { n: 'list' }; html = listHTML(); }
  $('#app').innerHTML = html + tabbar();
  if (view.n === 'vault' && CH) chartShow(CH.n - 1);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
lockView();
</script>
